<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>拼豆图纸生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>拼豆图纸生成器</h1>
    </header>
    <main class="tab-content">
      <!-- Tab 1: Generate -->
      <section id="tab-generate" class="tab-panel active">
        <!-- Row 1: Upload + Preview -->
        <div class="workspace-top">
          <!-- LEFT: Upload + Controls -->
          <div class="workspace-left">
            <div id="upload-area" class="upload-area">
              <div class="upload-placeholder" id="upload-placeholder">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="1.5">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p>点击或拖拽上传图片</p>
                <p class="hint">支持 PNG / JPG 格式</p>
                <input type="file" id="file-input" accept="image/png,image/jpeg" hidden>
              </div>
              <div id="preview-area" class="preview-area hidden">
                <img id="preview-img" alt="预览">
                <div id="original-info" class="img-info"></div>
              </div>
            </div>
            <div id="resize-controls" class="controls-card hidden">
              <div class="controls-row">
                <label>最长边像素点个数：
                  <input type="number" id="max-edge" value="58" min="10" max="200" class="input-number">
                </label>
                <label class="range-label">平滑：<input type="range" id="denoise-level" min="0" max="100" value="0" class="input-range"><span id="denoise-value">0</span></label>
              </div>
              <div class="controls-row" style="margin-top:10px;">
                <button id="btn-generate" class="btn-primary btn-sm">生成图纸</button>
                <button id="btn-reupload" class="btn-secondary btn-sm">清空</button>
              </div>
            </div>
          </div>

          <!-- RIGHT: Selected variant large preview -->
          <div class="workspace-right">
            <div id="right-empty-state" class="right-empty-state">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="1">
                <rect x="2" y="2" width="20" height="20" rx="3"/>
                <circle cx="8" cy="8" r="2"/><path d="m22 16-5-5L6 22"/>
              </svg>
              <p>生成结果将显示在这里</p>
            </div>
            <div id="selected-variant-preview" class="selected-variant-preview hidden">
              <img id="preview-variant-img" alt="效果图预览">
              <div class="preview-click-hint">点击查看大图</div>
            </div>
          </div>
        </div>

        <!-- Row 2: 5 variant cards -->
        <div id="variant-strip" class="variant-strip hidden"></div>

        <div id="loading" class="loading hidden">
          <div class="spinner"></div>
          <p id="loading-text">预处理图片中...</p>
        </div>
      </section>

      <!-- Tab 2: History -->
      <section id="tab-history" class="tab-panel">
        <div class="section-header">
          <h2>生成历史</h2>
          <button id="btn-clear-history" class="btn-danger btn-sm">清空历史</button>
        </div>
        <div id="history-list" class="masonry-grid">
          <p class="empty-hint">暂无历史记录</p>
        </div>
      </section>

      <!-- Tab 3: Gallery -->
      <section id="tab-gallery" class="tab-panel">
        <div class="section-header">
          <h2>我的作品</h2>
        </div>
        <div class="gallery-upload">
          <button id="btn-upload-work" class="btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            上传作品
          </button>
          <input type="file" id="gallery-file-input" accept="image/png,image/jpeg" hidden>
        </div>
        <div id="gallery-list" class="masonry-grid">
          <p class="empty-hint">暂无作品，快去上传吧</p>
        </div>
      </section>
    </main>

    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="tab-generate">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
        </svg>
        <span>生成图纸</span>
      </button>
      <button class="tab-btn" data-tab="tab-history">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>历史记录</span>
      </button>
      <button class="tab-btn" data-tab="tab-gallery">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
        <span>我的作品</span>
      </button>
    </nav>
  </div>

  <!-- Modal for viewing/editing -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="modal-close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Pattern Modal (pixel grid viewer with pinch-zoom) -->
  <div id="pattern-modal" class="pattern-modal hidden">
    <div class="pattern-modal-content">
      <div class="pattern-modal-header">
        <h3 id="pattern-modal-title">图纸详情</h3>
        <div class="pattern-modal-actions">
          <button id="pattern-modal-save" class="btn-primary btn-sm">保存到历史</button>
          <button id="pattern-modal-export" class="btn-primary btn-sm" style="background:#27ae60">导出图片</button>
          <button id="pattern-modal-close" class="modal-close">&times;</button>
        </div>
      </div>
      <div class="pattern-modal-body">
        <div id="pinch-zoom-container" class="pinch-zoom-container">
          <div id="pattern-modal-grid"></div>
        </div>
      </div>
      <div id="pattern-modal-summary" class="pattern-modal-summary"></div>
    </div>
  </div>

  <script src="perler-colors.js"></script>
  <script src="app.js"></script>
</body>
</html>
